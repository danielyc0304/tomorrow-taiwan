name: CI

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - run: pnpm audit
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test
  build-and-preview:
    name: Build and Preview
    runs-on: ubuntu-latest
    needs: [typecheck, lint, security, test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          install: false
      - run: pnpm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          url=$(vercel deploy --prebuilt \
                  --token=${{ secrets.VERCEL_TOKEN }} \
                  -m githubDeployment=1 \
                  -m githubCommitRef="$HEAD_REF")
          sha="${{ github.event.pull_request.head.sha }}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Preview Deployment
      - name: Create comment
        if: steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Preview Deployment

            | URL | Commit | Updated |
            | --- | --- | --- |
            | [Preview](${{ steps.deploy.outputs.url }}) | ${{ steps.deploy.outputs.sha }} | ${{ steps.deploy.outputs.time }} |
      - name: Update comment
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: |
            | [Preview](${{ steps.deploy.outputs.url }}) | ${{ steps.deploy.outputs.sha }} | ${{ steps.deploy.outputs.time }} |
